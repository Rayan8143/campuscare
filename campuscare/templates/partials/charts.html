<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
window.ccChart = function (id, type, labels, datasets, opts) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const palette = ['#2563eb', '#0d9488', '#f59f00', '#7c3aed', '#2fb344', '#d63939', '#64748b'];
  datasets.forEach((d, i) => {
    if (type === 'doughnut') { d.backgroundColor = d.backgroundColor || palette; d.borderWidth = 0; }
    else { d.backgroundColor = d.backgroundColor || palette[i] + (type === 'line' ? '22' : 'cc');
           d.borderColor = d.borderColor || palette[i]; d.borderRadius = 6; d.tension = .35; d.fill = type === 'line'; }
  });
  new Chart(el, { type, data: { labels, datasets }, options: Object.assign({
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: type === 'doughnut' || datasets.length > 1, position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } } },
    scales: type === 'doughnut' ? {} : { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: 'rgba(15,29,54,.06)' } } },
    cutout: type === 'doughnut' ? '68%' : undefined }, opts || {}) });
};
</script>
